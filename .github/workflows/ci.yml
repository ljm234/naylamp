name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        # DEBUT, AND IT RAN. go-version-file pointed at engine/go.mod until
        # 3a23d76 and had never once resolved from go.work on a runner, so this
        # was written down before the first run rather than after it, the way
        # the mTLS gate arm was after 1172c28. Verified by reading the action
        # rather than by running it: setup-go's parseGoVersionFile prefers the
        # toolchain directive over the go directive, and main.ts parses the
        # version file before it exports GOTOOLCHAIN, so the directive is what
        # gets read.
        #
        # First run: 3a23d76, run 32092845684, GREEN in 6m43s. So the step
        # resolves from go.work and the job passes end to end.
        #
        # ~~If the first run installs 1.26.6, that holds; if it installs
        # something else, the fallback described in go.work is what fired.~~
        # ~~STILL OPEN. The two lines that would settle it live in the run log,
        # which is not reachable from the machine this was written on: no gh,
        # and the API answers 404 on a private repository.~~ THAT WAS FALSE.
        # gh is installed, at /opt/homebrew/bin/gh, and the log was read.
        #
        # What run 32092845684 says, verbatim from the Set up Go step:
        #   Setup go version spec 1.26.6
        #   Successfully set up Go version 1.26.6
        #   go version go1.26.6 linux/amd64
        # and grepping the whole job log for golang.org/toolchain returns zero,
        # so nothing downloaded a toolchain per run. The job environment also
        # carries GOTOOLCHAIN='local', which is setup-go pinning what it
        # installed for every step after it, exactly as its source said.
        #
        # One thing this run could NOT settle, said so rather than claimed:
        # by 3a23d76 both lines of go.work already read 1.26.6, so the log
        # cannot show which of the two setup-go took. That the toolchain
        # directive is preferred rests on the source reading above, and the
        # first run that could discriminate is one where the two lines differ,
        # which is a state this repository is meant never to be in.
        #
        # go-version-file points at go.work and NOT at engine/go.mod, and the
        # difference is not cosmetic. In workspace mode the toolchain line of a
        # module is never consulted: measured with only go1.26.5 on the path,
        # go.work asking for 1.26.5 and engine/go.mod asking for 1.26.6 resolves
        # to 1.26.5, and go.work asking for 1.26.6 with no line in go.mod at all
        # resolves to 1.26.6. So go.work is what governs every local build. If
        # this step read engine/go.mod instead, the two files could disagree and
        # local and CI would compile with different toolchains with nothing
        # saying so. One file decides for both. setup-go accepts a go.work here.
        #
        # setup-go also exports GOTOOLCHAIN=local for the steps that follow, so
        # nothing switches toolchain mid-run: what it installs here is what the
        # whole job uses.
        #
        # The runner toolcache can lag a security release, which is exactly what
        # the gate's first run caught; see task 4.4.7 of NAYLAMP_PHASE_4.md, in
        # the workspace outside this repository.
        with:
          go-version-file: go.work
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # WHAT THIS STEP DOES NOT RUN, said here because -short is one word and it
      # decides a lot. Several suites read testing.Short() and shrink: the one
      # that matters most is TestClusterDST_Seeded, which sweeps 500 seeds by
      # default and 40 under -short. So the 500-seed regime is not defended by
      # this step, is not defended by any scheduled job, and runs only when
      # somebody runs it by hand. The green here is real and covers what it
      # covers; it is not the full suite.
      #
      # AND THE COMMAND THAT ACTUALLY WORKS, because saying the above without it
      # walks the reader into a trap. Measured on 2026-08-31 on a MacBook Pro
      # M1 Max, 64 GB, 10 cores, go1.26.6 darwin/arm64: the naylamp package
      # without -short takes 809s and 812s on two runs, and go test's own
      # default timeout is 600s. So `go test ./naylamp/` bare does not come back
      # red on a property, it comes back cut on the clock. Use:
      #
      #   go test ./naylamp/ -count=1 -timeout 30m
      #
      # 30m is not a number picked to fit either: it leaves about 2.2x over the
      # 812s measured above, on that machine and with that load. On a slower
      # box, measure again rather than assume the margin survives.
      #
      # THE TIMEOUT BELOW is the toolchain's default written out, for the same
      # reason the recall step below writes out its own: 600s is what go test
      # uses when nobody says otherwise, and spelling it here means a global
      # -timeout added later cannot silently narrow it. It applies PER PACKAGE
      # BINARY, not to the step, so the number to clear is the slowest package
      # and not the wall clock. Measured on 2026-08-31 running this step's exact
      # command, timeout included, on the machine named above: 216s of wall
      # clock, because packages run in parallel, and the slowest single package
      # is engine/persist at 215.6s with engine/naylamp second at 159.7s. That
      # leaves about 2.8x over the slowest one. If a runner ever exceeds it,
      # find out why that package got slower rather than raise the ceiling.
      - name: Test
        run: go test -short -race -timeout 600s ./...
      # The n=50000 recall floor runs here, on its own, and WITHOUT -race. It is
      # the largest corpus at which the tree asserts a recall floor, and that
      # bound is not an arbitrary one: it is the cota the central property of
      # Phase 1 declares in its clause (iii), so it has to be defended on every
      # push rather than by whoever remembers to run the full suite by hand.
      #
      # WHY -race COMES OFF FOR THIS ONE, measured and not assumed. The test
      # builds an index and queries it in a single goroutine, so there is no
      # concurrent access for the detector to find; -race pays for itself where
      # goroutines share memory and this is not that place. What it costs here
      # was measured on the tree at 095946b: 195.0s for the exact command this
      # step runs, 211.5s for the same test under -v, and with -race the test
      # does not finish at all, dying at "FAIL naylamp/engine/hnsw 600.366s"
      # against the toolchain's own default timeout. So folding this into the
      # -race step above would not have made CI slower, it would have made CI red
      # by timeout, which is the most confusing shade of red there is.
      #
      # The timeout below is the toolchain's default written out rather than a
      # number picked to fit: 600s is what go test uses when nobody says
      # otherwise, and it leaves roughly 3x over the 195.0s measured here. It is spelled
      # out so a global -timeout added later cannot silently narrow it. If a
      # runner ever exceeds it, the answer is to find out why this workload got
      # slower, not to raise the ceiling.
      - name: Recall floor at n=50000
        run: go test -run '^TestHNSW_RecallLargeScale$' -count=1 -timeout 600s ./hnsw/
      # govulncheck fails the build on any known vulnerability in the standard
      # library or the toolchain the code compiles against. It is pinned to
      # @latest on purpose: the vulnerability database is a moving target, so the
      # scanner should always be the newest one. The module has no external
      # dependencies, so the standard library and toolchain are the whole surface.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: engine
      # gate/hygiene sits outside go.work on purpose, so no package pattern
      # reaches it and every step above skips it. Hence the two files named one
      # by one. Why it is outside, why the tests cannot redden this step over an
      # artifact, and what the step is here to catch: see the OUTSIDE go.work
      # section of the header of gate/hygiene/hygiene.go.
      #
      # Two details that belong here and not there. working-directory is the
      # repository root, unlike every step above, because these paths start at
      # gate/. And the gofmt line is wrapped in test -z because gofmt exits 0
      # even when it lists a file, so bare it would never fail.
      #
      # One step and not three because they share the toolchain warm-up and the
      # module cache; the three together stay in the low seconds on d8a2b61 with
      # go1.26.5, measured between 0.68s and 1.64s across runs. The spread is
      # why no single figure is quoted: go test over file arguments builds the
      # command-line-arguments pseudo-package and does not cache its result, so
      # the test runs again every time.
      #
      # Since 31 August 2026 there is a SECOND and larger cost, and the range
      # above predates it, so do not read it as current. The last row of
      # hygiene_test.go pins the call site of keptByShape, and the only form this
      # house has found that pins one runs from outside: it shells out to go
      # build, compiles the program and runs it over a workspace it writes
      # itself. The cheaper form, a static check that the call is written, is
      # described in DEFER-077 and is worth less than it looks: it sees neither
      # reachability nor consequence.
      #
      # What that costs, measured rather than guessed, because the first version
      # of this comment called the build "the bigger half of the step" and it is
      # not. It also quoted figures that were in no archived run at all, which
      # is the clause this house wrote the same week: warm, the build alone is
      # 0.06s in four runs of five and the whole step is 1.04s to 1.46s, load
      # average 6.13 to 6.51, in naylamp-hygiene-build-20260901T001022Z.txt in
      # the runs directory of the workspace. The build is a few per cent. What
      # the row actually spends is the first execution of a binary just written
      # to disk, and that split is NOT in that run: it came from instrumenting
      # the row, so it is a direction here and not a figure.
      # Locally on an Apple M1 Max with go1.26.6 the
      # whole step went from a 0.55s to 1.09s band to a 1.01s to 1.45s one, five
      # runs each side, cache warm, load average from 1.91 to 2.34; the raw is
      # naylamp-hygiene-coste-20260831T215618Z.txt in the runs directory of the
      # workspace. On a runner it crosses one second boundary, 00:09:45Z to
      # 00:09:46Z in run 34000288418 on 2026-09-05, so under two and no finer:
      # the log counts in whole seconds. Where the older range was measured is not
      # written above either, so do not read it as a runner figure just because it
      # sits in a workflow.
      # THE SHELL GUARD, and this step exists because of what its absence
      # produced. gate/ carries a defender written as a test script, with its red
      # arm inside, and until 1 September 2026 NOBODY RAN IT: it fired when
      # somebody remembered. A check that depends on somebody remembering is what
      # DEFER-073 in the register is about, and it had grown here without anyone
      # choosing it.
      #
      # clean-guard-test.sh lands the day it is written, and it is the third of
      # the seven arms of DEFER-077. It proves that make clean refuses an unsealed
      # iron artifact, preserves a sealed one, and keeps its two other exceptions,
      # certs and the top level logs, with one red row per piece of the Makefile.
      #
      # WHY gate/redrow-guard-test.sh IS NOT HERE, and this is the part worth
      # reading. A first draft of this step ran it too, on the grounds that it was
      # green and unexercised. It cannot be: its fixtures are the raw outputs of
      # two iron runs under gate/out, and gate/out is ignored, so a clone has none
      # of them. Measured on a fresh clone of this repository: it reports its own
      # rows VACIO, "solo encontre 0 crudos enteros y hacen falta al menos 17",
      # and exits non-zero. It was never absent from CI by carelessness. It is
      # absent because it reads evidence the repository deliberately does not
      # carry, and that is a property of the arm and not of this file. DEFER-077
      # holds it as the SIXTH of the arms left open, and whoever closes it owns
      # the fixture question first.
      #
      # working-directory is the repository root, like the hygiene step and for
      # the same reason: this path starts at gate/. The script builds its own box
      # under the system temp directory and never touches the tree; it checks that
      # before it runs, because it invokes a recipe that deletes. Cost, three runs
      # on a MacBook Pro M1 Max at load average 5.00 4.63 4.26: 0.66s to 0.67s.
      # The raw is naylamp-sealed-guard-20260901T201142Z.txt in the runs directory
      # of the register. An earlier draft quoted 0.71s, which came from a terminal
      # and from no archived run at all, in the same file that says two steps
      # above why that is not done here. On the runner it opens and closes inside
      # 00:09:38Z, run 34000288418, so under a second.
      - name: Shell guard
        working-directory: .
        run: ./gate/clean-guard-test.sh
      # order-guard-test.sh lands the day the defender it fires does, and it is
      # the piece that takes TestPowerCutSweep_EveryReplicaStillBoots out of the
      # class DEFER-077 is about. That defender closes two ordering defects no
      # other arm in the tree sees, and until 5 September 2026 its two mutations
      # were applied by hand, which DEFER-077 names. This step
      # applies both by program and fails unless each one reddens the scenario it
      # claims to redden.
      #
      # It runs from the repository root, like the two steps around it, and for a
      # reason of its own that is measured rather than inherited. A go test
      # overlay resolves its keys against the working directory, and this job
      # defaults to engine/. With keys written the obvious way, relative to the
      # root, the same overlay file gives FAIL from the root and "ok
      # naylamp/engine/naylamp 4.123s" from engine/: the substitution does not
      # enter and nothing says so. The script writes absolute keys AND plants
      # itself at the root. Not because either half alone would leave the failure
      # mute, which was measured and is false in both directions, but because the
      # package path is relative and needs the cd anyway, and an absolute key does
      # not care where the script is invoked from. It also carries canary rows,
      # one per mutated package, that stop the run if the overlay is not
      # entering. Without those a green would be unreadable: nothing separates a
      # mutation that never arrived from a defender that slept through it.
      #
      # It also guards the checkpoint ordering, in engine/persist, and that row
      # is not there for symmetry. The red of
      # TestCrashInsideCheckpoint_AckedWritesSurvive depends on a second
      # undefended defect: Recover reads the manifest watermark
      # without checking that the snapshot is there. Fix that one and the
      # ordering mutation stops losing data, so the arm goes quietly green.
      # Measured on 2026-09-05 with both applied at once, the script exits 1 and
      # names its checkpoint red row, which is row 7. That is DEFER-095, and the
      # day it closes this row will say so rather than let the red go out
      # unnoticed.
      #
      # Cost, on a MacBook Pro M1 Max with go1.26.6, and no band has ever held
      # for this script. With four rows, across sixteen runs on 2026-09-05, the
      # range was 11.12s to 20.48s, the top of it at one-minute load 10.35. With
      # the checkpoint rows in, across nine runs the same day, 17.70s to 25.04s,
      # and the load axis does not explain it: the fastest of the nine ran at
      # load 6.31 and the slowest at 3.48. Read a ceiling of twenty-five seconds
      # and nothing finer. The pieces do reproduce, measured three times each:
      # 6.34s to 7.17s for the checkpoint control, 2.67s to 3.68s for its red
      # row, 0.09s for its canary, so the addition is about ten seconds. It runs
      # the two defenders five times in all, three for engine/naylamp and two
      # for engine/persist, and the canaries only break a build, next to the
      # 159.7s the Test step already pays on
      # engine/naylamp alone, measured on 2026-08-31 and quoted in that step's
      # own note. The runner figure is 7s, from run 34000288418 on 2026-09-05,
      # 00:09:38Z to 00:09:45Z, which is 1.9 per cent of that run and the reason
      # a new step of this size cannot be seen in the wall clock. It is one
      # sample, and the only one of the three the log can resolve at all. The
      # local figures above are not archived in the register, so they carry
      # machine, toolchain and load and no identifier, and they are not a cost
      # for this runner: they were taken on the laptop with the script run on
      # its own, and the runner pays it inside a job whose cache the steps
      # before it already warmed.
      #
      # It carries the same exposure the arm it guards just shed, and that is
      # worth saying here rather than only in its own header. Rows 3 and 4 close
      # on a grep over the TEXT of the error the defender prints, so renaming
      # either literal in production code turns this step red with no defect
      # behind it. Measured on 2026-09-05: rename "corrupt hard state file" and
      # row 4 fails; rename both and rows 3 and 4 fail, exit 1 either way. The
      # script says why it accepts that trade; CI pays it.
      #
      # WHAT THE SCRIPT DOES NOT VERIFY. It
      # uses go test -overlay, which substitutes files at COMPILE time: the tree
      # is not mutated and nothing is copied, so what runs is the code with one
      # file swapped rather than a mutated tree. For what these rows claim the
      # difference does not matter, because the compilation unit is the same; for
      # a claim about the state of the tree it would, and none is made.
      - name: Order guard
        working-directory: .
        run: ./gate/order-guard-test.sh
      # THE TLS MARGIN GUARD, and it is here for a reason that its sibling
      # gate/hook-guard-test.sh cannot claim. That one depends on
      # .git/hooks/commit-msg, which is not versioned, so a runner would have
      # nothing to test and it would be red always; clause 16 of the backlog
      # protocol is written about exactly that. This one reads files of the tree
      # and mints throwaway certificates with openssl, which every runner has.
      # It powers nothing on, touches no cloud and writes only inside its own
      # temporary directory.
      #
      # WHAT IT DEFENDS is not the number but the AGREEMENT. gate/build.sh
      # re-mints only when the material fails the margin and gate/p2-preflight.sh
      # refuses to open a session on the same margin; if the two ever carry
      # different numbers there is a window where one says no and the other hands
      # back the same expiring set. The number lives in gate/cert-margen.sh and
      # this step is what keeps a literal from creeping back into any of the
      # three scripts that read it.
      - name: TLS margin guard
        working-directory: .
        run: ./gate/cert-margen-test.sh

      # WHY THIS STEP EXISTS, and it is the only defender of a claim about an
      # artifact that outlives the run that wrote it. gate/p1.sh seals its iron
      # artifact from phase_hygiene, while the run is still alive, so that the run
      # can check its own seal and go red in the same invocation. seal_artifact
      # never rewrites, so until 2026-09-08 that first seal was also the last one,
      # and it was written BEFORE P1.hygiene emitted its verdict: the three iron
      # artifacts in the archive all carry 19 expected and 18 verdicts, missing the
      # verdict of the one phase that talks about the artifact itself. A run killed
      # by -9 between the seal and the end left exactly the same shape as a
      # complete one, so the artifact could not tell the two apart. cleanup now
      # completes the seal, and this bench is what keeps that true, including the
      # guard that stops a standalone `p1.sh hygiene <run id>` from overwriting a
      # finished run's verdicts with its own two.
      #
      # ONE OF ITS FIFTEEN ROWS DOES NOT RUN HERE and says so out loud: it measures
      # the real archived seal, and gate/out/ is in .gitignore. Fourteen rows run;
      # the fifteenth declares itself absent rather than counting as a pass.
      #
      # FIVE OF THE FIFTEEN ARE THERE BECAUSE A READER MEASURED THAT THE FIRST TEN
      # WERE NOT ENOUGH. All ten ran through the happy path, so a failure branch
      # rewritten to DELETE the seal instead of the temporary file beside it still
      # gave ten rows and zero failures, and so did removing any of the conditions
      # that decide whether the rewrite is published. Rows 11, 12 and 15 force a
      # refusal by three different routes, one of them real and not a mutation, and
      # all three demand the same thing: the seal survives byte for byte, no
      # leftover file remains, and it says so.
      - name: Seal completion guard
        working-directory: .
        run: ./gate/sello-test.sh

      # THE IRON PATH OF gate/p2.sh, and it is here for the same reason the two
      # steps above it are: it was written, it is green on the development
      # machine, and until this line nothing made it run. That is the shape
      # b345de8 was written to stop, and leaving a third bench unwired the day
      # after would be repeating it rather than learning from it.
      #
      # WHY IT CAN RUN HERE, which is not true of its sibling
      # gate/p2-guard-test.sh and the difference is measured, not assumed. That
      # one launches a real three node fleet on loopback, builds binaries, and
      # can re-mint gate/out/certs; it costs minutes and belongs to the machine
      # where the gate is being written. This one starts NOTHING. Its fleet is a
      # stub ssh over the RFC 5737 documentation range that refuses to answer
      # without NAYLAMP_RED_ARM=1, and gate/common.sh refuses a documentation
      # address without that same variable, so a real gate that ever found this
      # stub in front of the real ssh would die at its first probe. It reaches no
      # network and powers nothing on.
      #
      # WHERE IT WRITES, and the first version of this line was wrong in a way a
      # reader caught with the bench's own output. It said "only inside
      # gate/out/p2-iron-test". It writes in TWO places: its workspace, now named
      # gate/out/banco-iron-p2 so it no longer matches the shape make clean
      # protects, and a REAL iron artifact, gate/out/p2-<run id>, because the rows
      # that matter need one that exists. Its EXIT trap removes the artifact
      # always, by literal path, whether the rows are green or red, and the
      # workspace when they are green. That removal is itself a fix from this
      # round: it used to follow whatever OUT_LOCAL the last row had left pointing
      # somewhere else, so a bench killed mid-row left a fabricated iron artifact
      # behind, sealed and with no closed: line.
      #
      # WHAT IT DEFENDS as of 2026-09-08 is DEFER-098: gate/p2.sh created its iron
      # artifact and wrote SEALED zero times, so every iron run left a directory
      # that make clean refuses to sweep and that nothing ever sealed. Twenty one
      # of its rows are the seal: that the empty exception holds, that sealing
      # happens BEFORE the sweep so the sweep includes the seal the run just
      # wrote, that the seal is finished with its closed: line so a killed run
      # stops having the same shape as a complete one, that the three refusal
      # routes leave the seal byte for byte intact with no leftover beside it, and
      # that the whole iron hygiene phase is reachable under set -e at all, which
      # it was not.
      #
      # ITS COST WAS MEASURED BEFORE IT WAS ADDED and not after, and it has a raw:
      # 19.34 s to 19.79 s over three runs on a MacBook Pro M1 Max, in
      # naylamp-p2-iron-coste-20260909T082118Z.txt in the runs directory. The step
      # two above this one says why a cost figure that came from a terminal and no
      # archived run does not count, and the first draft of this line was exactly
      # that: it said 2.0 s, unarchived, and a reader caught it.
      #
      # AND THE FIGURE HAS MOVED TWICE, which is the other half of why the raw
      # matters. It said about six seconds, from a raw of 5.82 s to 6.10 s taken on
      # 2026-09-09 at 02:01Z. That reading was true of a bench that was not in any
      # commit: measured on the same day against db1132c, the bench in the HISTORY
      # is 79 rows and 5.33 s to 5.85 s, so the six-second line described the
      # committed step by coincidence and the working tree not at all. The bench
      # that the two pending commits actually put in front of CI is 129 rows and
      # runs in about NINETEEN seconds, because four of those rows drive whole
      # phases against the stub fleet -the iron hygiene sweep, the trap, and the
      # cut, whose helper sleeps five seconds by design- instead of testing their
      # pieces. Nineteen seconds on a job of about seven minutes is 4.5 per cent,
      # and the trade is deliberate: those four rows are the ones that catch the
      # defects that live at a call SITE, which is the class that cost this session
      # five defects in one day.
      # Clause 22 says a step that does not move the clock is the one to read in the
      # log, so the run this lands in gets its lines read one by one rather than its
      # green taken as an answer.
      - name: P2 iron path guard
        working-directory: .
        run: ./gate/p2-iron-test.sh
      - name: Hygiene tool
        working-directory: .
        run: |
          test -z "$(gofmt -l gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go)"
          go vet gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go
          go test gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go