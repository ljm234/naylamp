name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        # go-version-file reads the module's minimum, including the toolchain
        # line, so the runner always uses at least the toolchain go.mod declares,
        # with one place to update per security patch. The runner toolcache can
        # lag a security release, which is exactly what the gate's first run caught.
        with:
          go-version-file: engine/go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -short -race ./...
      # The n=50000 recall floor runs here, on its own, and WITHOUT -race. It is
      # the largest corpus at which the tree asserts a recall floor, and that
      # bound is not an arbitrary one: it is the cota the central property of
      # Phase 1 declares in its clause (iii), so it has to be defended on every
      # push rather than by whoever remembers to run the full suite by hand.
      #
      # WHY -race COMES OFF FOR THIS ONE, measured and not assumed. The test
      # builds an index and queries it in a single goroutine, so there is no
      # concurrent access for the detector to find; -race pays for itself where
      # goroutines share memory and this is not that place. What it costs here
      # was measured on the tree at 095946b: 195.0s for the exact command this
      # step runs, 211.5s for the same test under -v, and with -race the test
      # does not finish at all, dying at "FAIL naylamp/engine/hnsw 600.366s"
      # against the toolchain's own default timeout. So folding this into the
      # -race step above would not have made CI slower, it would have made CI red
      # by timeout, which is the most confusing shade of red there is.
      #
      # The timeout below is the toolchain's default written out rather than a
      # number picked to fit: 600s is what go test uses when nobody says
      # otherwise, and it leaves roughly 3x over the 195.0s measured here. It is spelled
      # out so a global -timeout added later cannot silently narrow it. If a
      # runner ever exceeds it, the answer is to find out why this workload got
      # slower, not to raise the ceiling.
      - name: Recall floor at n=50000
        run: go test -run '^TestHNSW_RecallLargeScale$' -count=1 -timeout 600s ./hnsw/
      # govulncheck fails the build on any known vulnerability in the standard
      # library or the toolchain the code compiles against. It is pinned to
      # @latest on purpose: the vulnerability database is a moving target, so the
      # scanner should always be the newest one. The module has no external
      # dependencies, so the standard library and toolchain are the whole surface.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: engine
      # gate/hygiene sits outside go.work on purpose, so no package pattern
      # reaches it and every step above skips it. Hence the two files named one
      # by one. Why it is outside, why the tests cannot redden this step over an
      # artifact, and what the step is here to catch: see the OUTSIDE go.work
      # section of the header of gate/hygiene/hygiene.go.
      #
      # Two details that belong here and not there. working-directory is the
      # repository root, unlike every step above, because these paths start at
      # gate/. And the gofmt line is wrapped in test -z because gofmt exits 0
      # even when it lists a file, so bare it would never fail.
      #
      # One step and not three because they share the toolchain warm-up and the
      # module cache; the three together stay in the low seconds on d8a2b61 with
      # go1.26.5, measured between 0.68s and 1.64s across runs. The spread is
      # why no single figure is quoted: go test over file arguments builds the
      # command-line-arguments pseudo-package and does not cache its result, so
      # the test runs again every time.
      - name: Hygiene tool
        working-directory: .
        run: |
          test -z "$(gofmt -l gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go)"
          go vet gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go
          go test gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go