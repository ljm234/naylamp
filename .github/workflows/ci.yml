name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        # DEBUT, AND IT RAN. go-version-file pointed at engine/go.mod until
        # 3a23d76 and had never once resolved from go.work on a runner, so this
        # was written down before the first run rather than after it, the way
        # the mTLS gate arm was after 1172c28. Verified by reading the action
        # rather than by running it: setup-go's parseGoVersionFile prefers the
        # toolchain directive over the go directive, and main.ts parses the
        # version file before it exports GOTOOLCHAIN, so the directive is what
        # gets read.
        #
        # First run: 3a23d76, run 32092845684, GREEN in 6m43s. So the step
        # resolves from go.work and the job passes end to end.
        #
        # ~~If the first run installs 1.26.6, that holds; if it installs
        # something else, the fallback described in go.work is what fired.~~
        # ~~STILL OPEN. The two lines that would settle it live in the run log,
        # which is not reachable from the machine this was written on: no gh,
        # and the API answers 404 on a private repository.~~ THAT WAS FALSE.
        # gh is installed, at /opt/homebrew/bin/gh, and the log was read.
        #
        # What run 32092845684 says, verbatim from the Set up Go step:
        #   Setup go version spec 1.26.6
        #   Successfully set up Go version 1.26.6
        #   go version go1.26.6 linux/amd64
        # and grepping the whole job log for golang.org/toolchain returns zero,
        # so nothing downloaded a toolchain per run. The job environment also
        # carries GOTOOLCHAIN='local', which is setup-go pinning what it
        # installed for every step after it, exactly as its source said.
        #
        # One thing this run could NOT settle, said so rather than claimed:
        # by 3a23d76 both lines of go.work already read 1.26.6, so the log
        # cannot show which of the two setup-go took. That the toolchain
        # directive is preferred rests on the source reading above, and the
        # first run that could discriminate is one where the two lines differ,
        # which is a state this repository is meant never to be in.
        #
        # go-version-file points at go.work and NOT at engine/go.mod, and the
        # difference is not cosmetic. In workspace mode the toolchain line of a
        # module is never consulted: measured with only go1.26.5 on the path,
        # go.work asking for 1.26.5 and engine/go.mod asking for 1.26.6 resolves
        # to 1.26.5, and go.work asking for 1.26.6 with no line in go.mod at all
        # resolves to 1.26.6. So go.work is what governs every local build. If
        # this step read engine/go.mod instead, the two files could disagree and
        # local and CI would compile with different toolchains with nothing
        # saying so. One file decides for both. setup-go accepts a go.work here.
        #
        # setup-go also exports GOTOOLCHAIN=local for the steps that follow, so
        # nothing switches toolchain mid-run: what it installs here is what the
        # whole job uses.
        #
        # The runner toolcache can lag a security release, which is exactly what
        # the gate's first run caught; see task 4.4.7 of NAYLAMP_PHASE_4.md, in
        # the workspace outside this repository.
        with:
          go-version-file: go.work
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # WHAT THIS STEP DOES NOT RUN, said here because -short is one word and it
      # decides a lot. Several suites read testing.Short() and shrink: the one
      # that matters most is TestClusterDST_Seeded, which sweeps 500 seeds by
      # default and 40 under -short. So the 500-seed regime is not defended by
      # this step, is not defended by any scheduled job, and runs only when
      # somebody runs it by hand. The green here is real and covers what it
      # covers; it is not the full suite.
      #
      # AND THE COMMAND THAT ACTUALLY WORKS, because saying the above without it
      # walks the reader into a trap. Measured on 2026-08-31 on a MacBook Pro
      # M1 Max, 64 GB, 10 cores, go1.26.6 darwin/arm64: the naylamp package
      # without -short takes 809s and 812s on two runs, and go test's own
      # default timeout is 600s. So `go test ./naylamp/` bare does not come back
      # red on a property, it comes back cut on the clock. Use:
      #
      #   go test ./naylamp/ -count=1 -timeout 30m
      #
      # 30m is not a number picked to fit either: it leaves about 2.2x over the
      # 812s measured above, on that machine and with that load. On a slower
      # box, measure again rather than assume the margin survives.
      #
      # THE TIMEOUT BELOW is the toolchain's default written out, for the same
      # reason the recall step below writes out its own: 600s is what go test
      # uses when nobody says otherwise, and spelling it here means a global
      # -timeout added later cannot silently narrow it. It applies PER PACKAGE
      # BINARY, not to the step, so the number to clear is the slowest package
      # and not the wall clock. Measured on 2026-08-31 running this step's exact
      # command, timeout included, on the machine named above: 216s of wall
      # clock, because packages run in parallel, and the slowest single package
      # is engine/persist at 215.6s with engine/naylamp second at 159.7s. That
      # leaves about 2.8x over the slowest one. If a runner ever exceeds it,
      # find out why that package got slower rather than raise the ceiling.
      - name: Test
        run: go test -short -race -timeout 600s ./...
      # The n=50000 recall floor runs here, on its own, and WITHOUT -race. It is
      # the largest corpus at which the tree asserts a recall floor, and that
      # bound is not an arbitrary one: it is the cota the central property of
      # Phase 1 declares in its clause (iii), so it has to be defended on every
      # push rather than by whoever remembers to run the full suite by hand.
      #
      # WHY -race COMES OFF FOR THIS ONE, measured and not assumed. The test
      # builds an index and queries it in a single goroutine, so there is no
      # concurrent access for the detector to find; -race pays for itself where
      # goroutines share memory and this is not that place. What it costs here
      # was measured on the tree at 095946b: 195.0s for the exact command this
      # step runs, 211.5s for the same test under -v, and with -race the test
      # does not finish at all, dying at "FAIL naylamp/engine/hnsw 600.366s"
      # against the toolchain's own default timeout. So folding this into the
      # -race step above would not have made CI slower, it would have made CI red
      # by timeout, which is the most confusing shade of red there is.
      #
      # The timeout below is the toolchain's default written out rather than a
      # number picked to fit: 600s is what go test uses when nobody says
      # otherwise, and it leaves roughly 3x over the 195.0s measured here. It is spelled
      # out so a global -timeout added later cannot silently narrow it. If a
      # runner ever exceeds it, the answer is to find out why this workload got
      # slower, not to raise the ceiling.
      - name: Recall floor at n=50000
        run: go test -run '^TestHNSW_RecallLargeScale$' -count=1 -timeout 600s ./hnsw/
      # govulncheck fails the build on any known vulnerability in the standard
      # library or the toolchain the code compiles against. It is pinned to
      # @latest on purpose: the vulnerability database is a moving target, so the
      # scanner should always be the newest one. The module has no external
      # dependencies, so the standard library and toolchain are the whole surface.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: engine
      # gate/hygiene sits outside go.work on purpose, so no package pattern
      # reaches it and every step above skips it. Hence the two files named one
      # by one. Why it is outside, why the tests cannot redden this step over an
      # artifact, and what the step is here to catch: see the OUTSIDE go.work
      # section of the header of gate/hygiene/hygiene.go.
      #
      # Two details that belong here and not there. working-directory is the
      # repository root, unlike every step above, because these paths start at
      # gate/. And the gofmt line is wrapped in test -z because gofmt exits 0
      # even when it lists a file, so bare it would never fail.
      #
      # One step and not three because they share the toolchain warm-up and the
      # module cache; the three together stay in the low seconds on d8a2b61 with
      # go1.26.5, measured between 0.68s and 1.64s across runs. The spread is
      # why no single figure is quoted: go test over file arguments builds the
      # command-line-arguments pseudo-package and does not cache its result, so
      # the test runs again every time.
      #
      # Since 31 August 2026 there is a SECOND and larger cost, and the range
      # above predates it, so do not read it as current. The last row of
      # hygiene_test.go pins the call site of keptByShape, and the only form this
      # house has found that pins one runs from outside: it shells out to go
      # build, compiles the program and runs it over a workspace it writes
      # itself. The cheaper form, a static check that the call is written, is
      # described in DEFER-077 and is worth less than it looks: it sees neither
      # reachability nor consequence.
      #
      # What that costs, measured rather than guessed, because the first version
      # of this comment called the build "the bigger half of the step" and it is
      # not. It also quoted figures that were in no archived run at all, which
      # is the clause this house wrote the same week: warm, the build alone is
      # 0.06s in four runs of five and the whole step is 1.04s to 1.46s, load
      # average 6.13 to 6.51, in naylamp-hygiene-build-20260901T001022Z.txt in
      # the runs directory of the workspace. The build is a few per cent. What
      # the row actually spends is the first execution of a binary just written
      # to disk, and that split is NOT in that run: it came from instrumenting
      # the row, so it is a direction here and not a figure.
      # Locally on an Apple M1 Max with go1.26.6 the
      # whole step went from a 0.55s to 1.09s band to a 1.01s to 1.45s one, five
      # runs each side, cache warm, load average from 1.91 to 2.34; the raw is
      # naylamp-hygiene-coste-20260831T215618Z.txt in the runs directory of the
      # workspace. No figure is quoted for the new shape from a runner, because
      # none exists yet: the first one is whatever the next run of this workflow
      # prints. Where the older range was measured is not written above either,
      # so do not read it as a runner figure just because it sits in a workflow.
      # THE SHELL GUARD, and this step exists because of what its absence
      # produced. gate/ carries a defender written as a test script, with its red
      # arm inside, and until 1 September 2026 NOBODY RAN IT: it fired when
      # somebody remembered. A check that depends on somebody remembering is what
      # DEFER-073 in the register is about, and it had grown here without anyone
      # choosing it.
      #
      # clean-guard-test.sh lands the day it is written, and it is the third of
      # the seven arms of DEFER-077. It proves that make clean refuses an unsealed
      # iron artifact, preserves a sealed one, and keeps its two other exceptions,
      # certs and the top level logs, with one red row per piece of the Makefile.
      #
      # WHY gate/redrow-guard-test.sh IS NOT HERE, and this is the part worth
      # reading. A first draft of this step ran it too, on the grounds that it was
      # green and unexercised. It cannot be: its fixtures are the raw outputs of
      # two iron runs under gate/out, and gate/out is ignored, so a clone has none
      # of them. Measured on a fresh clone of this repository: it reports its own
      # rows VACIO, "solo encontre 0 crudos enteros y hacen falta al menos 17",
      # and exits non-zero. It was never absent from CI by carelessness. It is
      # absent because it reads evidence the repository deliberately does not
      # carry, and that is a property of the arm and not of this file. DEFER-077
      # holds it as the SIXTH of the arms left open, and whoever closes it owns
      # the fixture question first.
      #
      # working-directory is the repository root, like the hygiene step and for
      # the same reason: this path starts at gate/. The script builds its own box
      # under the system temp directory and never touches the tree; it checks that
      # before it runs, because it invokes a recipe that deletes. Cost, three runs
      # on a MacBook Pro M1 Max at load average 5.00 4.63 4.26: 0.66s to 0.67s.
      # The raw is naylamp-sealed-guard-20260901T201142Z.txt in the runs directory
      # of the register. An earlier draft quoted 0.71s, which came from a terminal
      # and from no archived run at all, in the same file that says two steps
      # above why that is not done here. No runner figure exists yet.
      - name: Shell guard
        working-directory: .
        run: ./gate/clean-guard-test.sh
      - name: Hygiene tool
        working-directory: .
        run: |
          test -z "$(gofmt -l gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go)"
          go vet gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go
          go test gate/hygiene/hygiene.go gate/hygiene/hygiene_test.go